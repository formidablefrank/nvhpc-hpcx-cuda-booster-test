spack:
  repos:
  - ../spack-repo

  config:
    install_tree:
      root: /leonardo_work/ICT26_MHPC_0/franco/spack-install/env-nvhpc-26.3-hpcx-2.25-cuda-12.9
    source_cache: /leonardo_work/ICT26_MHPC_0/franco/spack-source-cache
    binary_index_root: /leonardo_work/ICT26_MHPC_0/franco/spack-binary-index
    build_stage:
    - /leonardo_work/ICT26_MHPC_0/franco/spack-stage

  concretizer:
    unify: when_possible
    reuse: false

  specs:
  - nvhpc@26.3 %gcc@12.2.0 ~mpi +blas +lapack default_cuda=12.9
  - cuda@12.9 %nvhpc@26.3
  - nccl@2.22.3-1 %nvhpc@26.3 cuda_arch=80 ^cuda@12.9
  - gdrcopy@2.5.1 %nvhpc@26.3 +cuda cuda_arch=80 ^cuda@12.9
  - cudnn@9.23.0.39-12 %nvhpc@26.3 ^cuda@12.9
  - binutils@2.42 %gcc@12.2.0
  - hdf5@1.14.3 %nvhpc@26.3
  - netcdf-c@4.9.2 %nvhpc@26.3
  - netcdf-fortran@4.6.1 %nvhpc@26.3
  - parallel-netcdf@1.12.3 %nvhpc@26.3

  packages:
    all:
      target: [icelake]
      providers:
        mpi: [hpcx-mpi]
    nvhpc:
      externals:
      - spec: nvhpc@26.3 ~mpi +blas +lapack default_cuda=12.9
        prefix: /leonardo_work/ICT26_MHPC_0/franco/spack-install/env-nvhpc-26.3-hpcx-2.20/linux-rhel8-icelake/gcc-12.2.0/nvhpc-26.3-e2lv6bo2xk2zpw4hoilvgnpbxw3d6zyr
      buildable: false
    hpcx-mpi:
      externals:
      - spec: hpcx-mpi@2.25.1
        prefix: /leonardo_work/ICT26_MHPC_0/franco/spack-install/env-nvhpc-26.3-hpcx-2.20/linux-rhel8-icelake/gcc-12.2.0/nvhpc-26.3-e2lv6bo2xk2zpw4hoilvgnpbxw3d6zyr/Linux_x86_64/26.3/comm_libs/12.9/hpcx/hpcx-2.25.1/ompi
      buildable: false
    cuda:
      externals:
      - spec: cuda@12.9
        prefix: /leonardo_work/ICT26_MHPC_0/franco/spack-install/env-nvhpc-26.3-hpcx-2.20/linux-rhel8-icelake/gcc-12.2.0/nvhpc-26.3-e2lv6bo2xk2zpw4hoilvgnpbxw3d6zyr/Linux_x86_64/26.3/cuda/12.9
      buildable: false
    nccl:
      buildable: true
    gdrcopy:
      buildable: true
      variants:
      - +cuda
      - cuda_arch=80
    cudnn:
      buildable: true
    binutils:
      buildable: true
      variants:
      - +gas
      - +ld
    hdf5:
      buildable: true
      variants:
      - +mpi
      - +fortran
      - +hl
    netcdf-c:
      buildable: true
      variants:
      - +mpi
      - ~blosc
      - ~szip
      - ~zstd
    netcdf-fortran:
      buildable: true
    parallel-netcdf:
      buildable: true
      variants:
      - +cxx
      - +fortran
